services:
  - type: web
    name: surajsong-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ACESTEP_WORKER_URL
        sync: false
      - key: SURAJSONG_DB_PATH
        value: /tmp/surajsong.db
